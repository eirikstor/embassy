[target.thumbv6m-none-eabi]
runner = [
    "probe-rs",
    "run",
    "--chip",
    "LPC804M101JDH24",
    "--log-format",
    "{t} {L} {s}",
]
rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
]

[build]
target = "thumbv6m-none-eabi" # Cortex-M0

[env]
DEFMT_LOG = "trace"

[profile.release]
# Allows defmt to display log locations even in release
debug = true
